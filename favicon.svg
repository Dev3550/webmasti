<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0f17" />
      <stop offset="100%" stop-color="#1a102f" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="50%" stop-color="#bf00ff" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="url(#iconGrad)" stroke-width="6" opacity="0.6" />

  <!-- Play Flame Symbol -->
  <g filter="url(#glow)">
    <path d="M190 140 L380 256 L190 372 Z" fill="url(#iconGrad)" />
    <!-- Inner Accent Sparkle -->
    <path d="M210 180 L330 256 L210 332 Z" fill="#ffffff" opacity="0.25" />
  </g>
</svg>
